[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rag-kit"
version = "0.1.0"
description = "A standalone RAG library — load text files, search chunks, ask questions via LLM pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Rubberflex Instruments", email = "azuan@rubberflex.com.my" },
]
keywords = ["rag", "search", "text", "llm", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
web = ["httpx>=0.27"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.0"]
keywords = ["yake>=0.4.8"]
llm = ["httpx>=0.27"]
postgres = ["psycopg2-binary>=2.9"]
all = [
    "rag-kit[web]",
    "rag-kit[pdf]",
    "rag-kit[docx]",
    "rag-kit[keywords]",
    "rag-kit[llm]",
    "rag-kit[postgres]",
]

[project.urls]
Homepage = "https://github.com/aabdulrazak298/rag-kit"
Repository = "https://github.com/aabdulrazak298/rag-kit"

[project.scripts]
rag-kit = "rag_kit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
