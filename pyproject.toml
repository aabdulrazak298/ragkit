[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kit"
version = "0.1.0"
description = "A standalone RAG library — load text files, search chunks, ask questions via LLM pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Azuan Abdul Razak", email = "aabdulrazak@icloud.com" },
]
keywords = ["rag", "search", "text", "llm", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "turbovec>=0.7",
    "numpy>=1.24",
    "flashrank>=0.2",
]

[project.optional-dependencies]
web = ["httpx>=0.27"]
pdf = ["pypdf>=4.0", "cryptography>=3.1"]
docx = ["python-docx>=1.0"]
keywords = ["yake>=0.4.8"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.16"]
docling = ["docling>=2.0"]
docling-gpu = ["docling>=2.0", "onnxruntime-gpu>=1.20"]
pptx = ["python-pptx>=1.0"]
epub = ["ebooklib>=0.17", "beautifulsoup4>=4.0"]
odt = ["odfpy>=1.4"]
rtf = ["striprtf>=0.0"]
ui = ["gradio>=4.44"]
llm = ["httpx>=0.27"]
postgres = ["psycopg2-binary>=2.9"]
all = [
    "rag-kit[web]",
    "rag-kit[pdf]",
    "rag-kit[docx]",
    "rag-kit[pptx]",
    "rag-kit[epub]",
    "rag-kit[odt]",
    "rag-kit[rtf]",
    "rag-kit[keywords]",
    "rag-kit[ocr]",
    "rag-kit[docling]",
    "rag-kit[ui]",
    "rag-kit[llm]",
    "rag-kit[postgres]",
]

[project.urls]
Homepage = "https://github.com/aabdulrazak298/ragkit"
Repository = "https://github.com/aabdulrazak298/ragkit"

[project.scripts]
rag-kit = "rag_kit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
