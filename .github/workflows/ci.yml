name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core deps + pdf extra, as a pip user would)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
          pip install pytest

      - name: Run test suite
        run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  docling:
    # Heavy extra (pulls torch) — don't run conversions, just verify the
    # advertised extra installs and the lazy docling path is importable.
    name: Docling extra installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with docling extra
        run: pip install ".[docling]"

      - name: Smoke test docling path
        run: python -c "from rag_kit import _docling; assert _docling.is_available(); print('docling OK')"
